[project]
name = "soundfunc"
version = "0.1.0"
description = "CLI для разбора музыки: темп, размер, тональность, аккорды и piano-roll"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.24",
    "soundfile>=0.12",
    "matplotlib>=3.8",
    "mido>=1.3",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sfunc = "soundfunc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundfunc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
